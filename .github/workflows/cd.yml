name: CD - Production Release

on:
  push:
    branches:
      - main

jobs:
  build-and-release:
    name: Build & Release Production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration de Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configuration de Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Installation des dépendances
        run: flutter pub get

      - name: Génération de code (Drift)
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Build de l'App Bundle (AAB) pour le Play Store
        run: flutter build appbundle --release

      - name: Signer l'application
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: build/app/outputs/bundle/release
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Créer le tag de version
        id: create_tag
        run: |
          VERSION_TAG="v$(date +'%Y.%m.%d-%H%M')"
          echo "tag=$VERSION_TAG" >> $GITHUB_OUTPUT

      - name: Créer la Release GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.create_tag.outputs.tag }}
          name: Release ${{ steps.create_tag.outputs.tag }}
          generate_release_notes: true
          files: ${{ steps.sign_app.outputs.signedReleaseFile }}
