name: CD - Production Release

on:
  push:
    branches:
      - main

jobs:
  build-and-release:
    name: Build & Release Production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration de Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configuration de Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Installation des dépendances
        run: flutter pub get

      - name: Creer env.json depuis les secrets
        run: |
          echo '{
            "SUPABASE_URL": "${{ secrets.SUPABASE_URL }}",
            "SUPABASE_ANON_KEY": "${{ secrets.SUPABASE_ANON_KEY }}"
          }' > env.json

      - name: Génération de code (Drift)
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Build de l'App Bundle (AAB) pour le Play Store
        run: flutter build appbundle --release --dart-define-from-file=env.json

      - name: Vérifier les secrets
        run: |
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then echo "Erreur: KEYSTORE_BASE64 est vide"; exit 1; fi
          if [ -z "${{ secrets.STORE_PASSWORD }}" ]; then echo "Erreur: STORE_PASSWORD est vide"; exit 1; fi
          if [ -z "${{ secrets.KEY_ALIAS }}" ]; then echo "Erreur: KEY_ALIAS est vide"; exit 1; fi
          if [ -z "${{ secrets.KEY_PASSWORD }}" ]; then echo "Erreur: KEY_PASSWORD est vide"; exit 1; fi

      - name: Signer l'application
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: build/app/outputs/bundle/release
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Créer le tag de version
        id: create_tag
        run: |
          VERSION_TAG="v$(date +'%Y.%m.%d-%H%M')"
          echo "tag=$VERSION_TAG" >> $GITHUB_OUTPUT

      - name: Créer la Release GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.create_tag.outputs.tag }}
          name: Release ${{ steps.create_tag.outputs.tag }}
          generate_release_notes: true
          files: ${{ steps.sign_app.outputs.signedReleaseFile }}
